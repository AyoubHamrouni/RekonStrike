name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekonstrike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with ruff
        run: ruff check src/rekonstrike/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vulnbank
          POSTGRES_PASSWORD: vulnbank_password
          POSTGRES_DB: rekonstrike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rekonstrike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
      - name: Run migrations
        run: PYTHONPATH=src alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://vulnbank:vulnbank_password@localhost:5432/rekonstrike_test
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://vulnbank:vulnbank_password@localhost:5432/rekonstrike_test
          PYTHONPATH: src

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekonstrike/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    strategy:
      matrix:
        tool:
          - subfinder
          - httpx
          - nuclei
          - gau
          - shuffledns
          - dnsx
          - amass
          - naabu
          - gospider
          - metabigor
          - github-subdomains
          - katana
          - ffuf
          - cewl
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push tool container
        uses: docker/build-push-action@v6
        with:
          context: rekonstrike/docker/tools
          file: rekonstrike/docker/tools/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.tool }}:latest
          build-args: TOOL=${{ matrix.tool }}
      - name: Build and push API container
        uses: docker/build-push-action@v6
        with:
          context: rekonstrike
          file: rekonstrike/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
