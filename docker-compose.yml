services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: rekonstrike-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/rekonstrike
      TOOL_MODE: docker
      TOOL_CONCURRENCY: "5"
      TOOL_TIMEOUT: "300"
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BROWSER_SERVICE_URL: http://browser-service:3001
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - rekonstrike

  proxy-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    container_name: rekonstrike-proxy
    ports:
      - "8080:8080"
    environment:
      RS_PROGRAM_ID: ${RS_PROGRAM_ID:-1}
      RS_USER_ID: ${RS_USER_ID:-1}
      RS_DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/rekonstrike
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/rekonstrike
      RS_REDIS_URL: redis://redis:6379/0
      RS_PROXY_MAX_BODY_BYTES: 10485760
      RS_SCOPE_TTL_SECONDS: 300
      RS_PROXY_FAIL_CLOSED: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rekonstrike
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
      args:
        API_PROXY_TARGET: http://api:8000
    container_name: rekonstrike-ui
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rekonstrike

  browser-service:
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    container_name: rekonstrike-browser-service
    ports:
      - "3001:3001"
    environment:
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
    restart: unless-stopped
    networks:
      - rekonstrike

  db:
    image: postgres:17-alpine
    container_name: rekonstrike-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rekonstrike
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rekonstrike

  redis:
    image: redis:7-alpine
    container_name: rekonstrike-redis
    restart: unless-stopped
    networks:
      - rekonstrike

  # ── Tool containers (build only via --profile tools) ─────────────────────
  subfinder:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: subfinder
    image: rekonstrike/subfinder:latest

  httpx:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: httpx
    image: rekonstrike/httpx:latest

  nuclei:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: nuclei
    image: rekonstrike/nuclei:latest

  katana:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: katana
    image: rekonstrike/katana:latest

  gau:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: gau
    image: rekonstrike/gau:latest

  shuffledns:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: shuffledns
    image: rekonstrike/shuffledns:latest

  dnsx:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: dnsx
    image: rekonstrike/dnsx:latest

  amass:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: amass
    image: rekonstrike/amass:latest

  naabu:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: naabu
    image: rekonstrike/naabu:latest

  gospider:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: gospider
    image: rekonstrike/gospider:latest

  ffuf:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile
      args:
        TOOL: ffuf
    image: rekonstrike/ffuf:latest

  cloud_enum:
    profiles: ["tools"]
    build:
      context: docker/tools
      dockerfile: Dockerfile.cloud_enum
    image: rekonstrike/cloud_enum:latest

volumes:
  pgdata:

networks:
  rekonstrike:
    driver: bridge
