[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekonstrike"
version = "0.1.0"
description = "Advanced Reconnaissance & Asset Discovery Framework"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "aiohttp>=3.10",
    "docker>=7.1",
    "redis>=5.2",
    "arq>=0.26",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
rekonstrike = "rekonstrike.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rekonstrike"]
